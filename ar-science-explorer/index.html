<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Science Explorer</title>
    <!--
      Critical CSS variables injected before Tailwind/JS loads.
      This prevents invisible text during the very first paint when
      CSS custom properties haven't been applied yet (race between
      Vite injecting the stylesheet and React rendering the component).
      No webfont here on purpose — see DESIGN.md "Type" for why the
      system-font stack replaced Poppins: zero load race, zero flash,
      and it reads as a native tool rather than a themed template.
    -->
    <style>
      html { color-scheme: dark; }
      html, html.dark {
        --foreground: 210 20% 92%;
        --background: 222 18% 9%;
        --muted-foreground: 215 12% 58%;
        --primary: 217 91% 60%;
      }
      html.light {
        --foreground: 222 20% 14%;
        --background: 0 0% 100%;
        --muted-foreground: 220 9% 44%;
        --primary: 221 83% 53%;
      }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </head>
  <body>
    <!--
      IMPECCABLE-DIRECTION seed:8f2c1a4e
      THESIS: A student science tool that reads as a precise instrument, not
      a themed dashboard — clarity and restraint replace decorative gradient
      chrome, mega-radius cards, and hype badges.
      OWN-WORLD: Near-black/near-white neutral ground, one confident blue
      accent (no gradients), a small consistent radius scale (6/8/12/16px),
      system-font stack, subject colors used only as functional tags.
      STORY: Students see their next lesson and progress with zero visual
      noise between them and the task; teachers see a serious operating
      tool, not a toy skinned differently from the student side.
      FIRST VIEWPORT: Login and Home lead with one clear primary action,
      real content immediately visible, no decorative hero blobs.
      FORM: Canon path (Linear + Notion + Duolingo craft bar), chosen
      deliberately over an exotic visual-world direction because this is
      an Operate-mode task tool, not a marketing surface.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
